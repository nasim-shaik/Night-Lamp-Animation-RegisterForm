<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night Lamp Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <!-----------Table lamp section--------------------->
        <div class="lamp-container">
            <div class="lamp-shade"></div>
            <div class="light-glow"></div>
            <div class="lamp-stand"></div>
            <div class="lamp-base"></div>

            <!----------------Pull wire------------------------------>
            <div class="wire-container" id="wireBtn" title="Click to pull">
                <div class="wire"></div>
                <div class="wire-handle"></div>
            </div>
        </div>
        <div class="form-container">
            <h2>
                Register
            </h2>
            <form action="#" onsubmit="event.preventDefault();alert ('Resgistration Successful!');">
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="Enter your name">
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Enter your mail">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="submit-btn">
                    Sign Up
                </button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
